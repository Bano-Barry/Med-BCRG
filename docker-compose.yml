services:
  # ============================================================================
  # Base de données PostgreSQL
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: medbcrg-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-infirmerie_bcrg}
      POSTGRES_USER: ${DB_USER:-infirmerie_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres_secure_password_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5435}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-infirmerie_admin} -d ${DB_NAME:-infirmerie_bcrg}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - medbcrg-network

  # ============================================================================
  # Application Backend API (Node.js / Express / Prisma) -> Port 5003
  # ============================================================================
  backend:
    build:
      context: ./projet-backend-med_bcrg
      dockerfile: Dockerfile
    container_name: medbcrg-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${DB_USER:-infirmerie_admin}:${DB_PASSWORD:-postgres_secure_password_2026}@postgres:5432/${DB_NAME:-infirmerie_bcrg}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-1h}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      UPLOAD_DIR: /app/uploads
      BCRG_HUB_URL: ${BCRG_HUB_URL:-http://localhost:5001}
      BCRG_HUB_JWKS_URL: ${BCRG_HUB_JWKS_URL:-http://localhost:5001/api/security/.well-known/jwks.json}
      BCRG_HUB_JWT_SECRET: ${BCRG_HUB_JWT_SECRET:-supersecret_bcrg_hub_production_jwt_key_2026}
      AUTO_MIGRATE: ${AUTO_MIGRATE:-true}
      AUTO_SEED: ${AUTO_SEED:-true}
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "${BACKEND_PORT:-5003}:5000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - medbcrg-network

  # ============================================================================
  # Application Frontend Web (React / Vite / Nginx) -> Port 3003
  # ============================================================================
  frontend:
    build:
      context: ./MedBCRG
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_BCRG_HUB_URL: ${VITE_BCRG_HUB_URL:-http://localhost:5001}
    container_name: medbcrg-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3003}:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - medbcrg-network

volumes:
  postgres_data:
    name: medbcrg_postgres_data
  uploads_data:
    name: medbcrg_uploads_data

networks:
  medbcrg-network:
    name: medbcrg-network
    driver: bridge
